# Optional integration. Requires External Secrets Operator with v1 CRDs and a configured
# ClusterSecretStore named cityquest-secret-store. Values live in the external provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-runtime, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target: {name: cityquest-runtime, creationPolicy: Owner}
  dataFrom:
    - extract: {key: cityquest/prod/runtime}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-migration, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target: {name: cityquest-migration, creationPolicy: Owner}
  dataFrom:
    - extract: {key: cityquest/prod/migration}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-bootstrap, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target: {name: cityquest-bootstrap, creationPolicy: Owner}
  dataFrom:
    - extract: {key: cityquest/prod/bootstrap}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-pg-owner, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target:
    name: cityquest-pg-owner
    creationPolicy: Owner
    template: {type: kubernetes.io/basic-auth}
  dataFrom:
    - extract: {key: cityquest/prod/pg-owner}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-pg-app, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target:
    name: cityquest-pg-app
    creationPolicy: Owner
    template: {type: kubernetes.io/basic-auth}
  dataFrom:
    - extract: {key: cityquest/prod/pg-app}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-backup-s3, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target: {name: cityquest-backup-s3, creationPolicy: Owner}
  dataFrom:
    - extract: {key: cityquest/prod/backup-s3}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cityquest-metrics, namespace: cityquest}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cityquest-secret-store, kind: ClusterSecretStore}
  target: {name: cityquest-metrics, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: cityquest/prod/runtime, property: METRICS_TOKEN}
