apiVersion: batch/v1
kind: Job
metadata:
  name: cityquest-bootstrap-v8
  namespace: cityquest
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cityquest-maintenance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: cityquest:0.8.0
          command: [node, scripts/admin-postgres.mjs, --bootstrap]
          envFrom:
            - configMapRef:
                name: cityquest-config
            - secretRef:
                name: cityquest-migration
            - secretRef:
                name: cityquest-bootstrap
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /run/secrets/postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: postgres-ca
          secret:
            secretName: cityquest-pg-ca
            defaultMode: 0444
