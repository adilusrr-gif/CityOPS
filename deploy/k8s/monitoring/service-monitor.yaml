# Optional: requires Prometheus Operator and a Prometheus instance selecting this ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cityquest
  namespace: cityquest
  labels:
    app.kubernetes.io/name: cityquest
spec:
  namespaceSelector:
    matchNames: [cityquest]
  selector:
    matchLabels:
      app.kubernetes.io/name: cityquest
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: cityquest-metrics
          key: token
